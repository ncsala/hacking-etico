#!/usr/sbin/nft -f
# Lab Purple Team — firewall de la VPS azul
# NO se usa "flush ruleset": preserva las tablas que Docker administra.
# Unica fuente de verdad del firewall (ufw deshabilitado 2026-11-16).

table inet filter
delete table inet filter

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept

        # SSH (la proteccion anti-bruteforce la hace fail2ban)
        tcp dport 22 accept

        # HTTP/HTTPS: CERRADO. Se reabre en E03 solo para la IP roja.
        # tcp dport { 80, 443 } accept

        # ICMP necesario para PMTUD, limitado
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } limit rate 4/second accept
        ip6 nexthdr ipv6-icmp accept

        limit rate 5/minute counter log prefix "nft-drop: " drop
        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        # Docker: contenedores hacia internet (incluye el tunnel de CF).
        # SIN estas reglas el tunnel muere (incidente 2026-11-16).
        iifname "br-*" accept
        iifname "docker0" accept
        # Respuestas de conexiones establecidas de/hacia contenedores
        oifname "br-*" ct state established,related accept
        oifname "docker0" ct state established,related accept
        limit rate 5/minute counter log prefix "nft-fwd-drop: " drop
        counter drop
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
